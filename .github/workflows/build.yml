name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          mv lib latest/ 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
      - name: Build NDALA
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/safeguard/onehub
          printf "pluginManagement{\nrepositories{google();mavenCentral();gradlePluginPortal()}\n}\ninclude ':app'\n" > settings.gradle
          echo " " > build.gradle
          printf "plugins{id 'com.android.application' version '8.1.0'}\nrepositories{google();mavenCentral()}\nandroid{namespace 'com.safeguard.onehub';compileSdk 34;defaultConfig{applicationId 'com.safeguard.onehub';minSdk 24;targetSdk 34;versionCode 1;versionName '1.0'}}\ndependencies{implementation 'androidx.appcompat:appcompat:1.6.1'}\n" > app/build.gradle
          printf '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="SafeGuard NDALA"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          printf 'package com.safeguard.onehub;import android.os.Bundle;import androidx.appcompat.app.AppCompatActivity;import android.webkit.*;public class MainActivity extends AppCompatActivity{WebView w;protected void onCreate(Bundle b){super.onCreate(b);w=new WebView(this);setContentView(w);w.getSettings().setJavaScriptEnabled(true);w.setWebViewClient(new WebViewClient(){public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){String u=r.getUrl().toString().toLowerCase();if(u.contains("pornhub")||u.contains("xvideos")||u.contains("xnxx")||u.contains("xhamster")){v.loadData("<h1>Blocked by NDALA Family Shield</h1>","text/html","UTF-8");return true;}return false;}});w.loadUrl("https://www.google.com");}}' > app/src/main/java/com/safeguard/onehub/MainActivity.java
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-NDALA-APK
          path: app/build/outputs/apk/debug/*.apk
